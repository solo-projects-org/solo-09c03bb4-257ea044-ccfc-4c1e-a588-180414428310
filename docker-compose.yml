# Two API instances, one shared SQLite database and one shared raw-byte
# archive on a named volume. Both containers run on the same Docker host, so
# WAL-mode file locking serializes writers and os.replace publishes archive
# files atomically exactly like two processes on one machine.
services:
  api-a:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - energy-data:/data
    environment:
      DB_PATH: /data/energy.db
      ARCHIVE_DIR: /data/archives

  api-b:
    build: .
    ports:
      - "8002:8000"
    volumes:
      - energy-data:/data
    environment:
      DB_PATH: /data/energy.db
      ARCHIVE_DIR: /data/archives

volumes:
  energy-data:
